name: Release

# A tag `v<VERSION>` builds the signed prod App Bundle and attaches it to a GitHub release.
# There is no store upload: the Play and App Store steps are manual (docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: Build the prod AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "secret ANDROID_KEYSTORE_BASE64 is not set" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OPENBEKCI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          OPENBEKCI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENBEKCI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENBEKCI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OPENBEKCI_SERVER: ${{ vars.OPENBEKCI_SERVER }}
        run: bash tool/ci/retry_native_assets.sh bash tool/release.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/app/outputs/bundle/prodRelease/app-prod-release.aab \
            --title "$GITHUB_REF_NAME" --generate-notes
