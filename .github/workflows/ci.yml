name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/openbekci_api/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: Analyze
        run: flutter analyze

      # Goldens are compared, never updated: --update-goldens is not used in CI.
      - name: Test (unit, widget, contract, goldens)
        run: flutter test --reporter expanded

      - name: Goldens unchanged
        run: git diff --exit-code -- test/golden

      - name: Build dev debug APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
