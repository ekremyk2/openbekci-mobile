name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/openbekci_api/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # Native-asset hooks (pdfium_dart, sqlite3) download prebuilt libraries
      # into .dart_tool. Cache them so a flaky github.com does not break the
      # build; the cache is only saved after a green job, so a truncated file
      # is never stored.
      - name: Cache native-asset hook outputs
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            .dart_tool/native_assets
          key: native-assets-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/openbekci_api/pubspec.yaml') }}
          restore-keys: native-assets-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: Analyze
        run: flutter analyze

      # Goldens are compared, never updated: --update-goldens is not used in CI.
      - name: Test (unit, widget, contract, goldens)
        run: flutter test --reporter expanded

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures
          if-no-files-found: ignore
          retention-days: 7

      - name: Goldens unchanged
        run: git diff --exit-code -- test/golden

      - name: Build dev debug APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug --flavor dev -t lib/main_dev.dart; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "::warning::APK build attempt $attempt failed; clearing downloaded native assets and retrying in ${delay}s"
              # A truncated download must not be reused (sqlite3 hash mismatch).
              rm -rf .dart_tool/hooks_runner .dart_tool/native_assets
              sleep "$delay"
            fi
          done
          echo "::error::APK build failed after 3 attempts"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
