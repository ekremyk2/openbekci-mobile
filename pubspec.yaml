name: openbekci_mobile
description: "OpenBekci mobile app: resident app for OpenBekci instances."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  openbekci_api:
    path: packages/openbekci_api
  app_links: ^7.2.2
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  intl: ^0.20.3
  logger: ^2.8.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

  riverpod: any
  share_plus: ^13.3.1
  local_auth: ^3.0.2
  image_picker: ^1.2.4
  image: ^4.12.0
  flutter_markdown_plus: ^1.0.12
  pdfrx: ^2.12.0
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.0.0
  unifiedpush: ^6.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4
  crypto: ^3.0.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_config.json
